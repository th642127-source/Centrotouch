name: Build CentroTouch APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extraer proyecto
        shell: bash
        run: |
          set -e
          rm -rf proyecto
          mkdir -p proyecto
          unzip -o CentroTouch-GitHub.zip -d proyecto

      - name: Buscar proyecto y compilar APK
        shell: bash
        run: |
          set -e

          echo "Buscando gradlew..."

          GRADLEW=$(find proyecto -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró el archivo gradlew."
            echo "Archivos encontrados:"
            find proyecto -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "gradlew encontrado:"
          echo "$GRADLEW"

          echo "Directorio del proyecto:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Buscar APK generado
        shell: bash
        run: |
          set -e

          APK=$(find proyecto -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró ningún APK."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p apk-final
          cp "$APK" apk-final/CentroTouch.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CentroTouch-APK
          path: apk-final/CentroTouch.apk
