name: Build CentroTouch APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Buscar ZIP del proyecto
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "NO SE ENCONTRO EL ZIP DEL PROYECTO"
            exit 1
          fi

          echo "ZIP: $ZIP"
          rm -rf proyecto
          mkdir proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Encontrar proyecto Android
        run: |
          set -e

          SETTINGS=$(find proyecto -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "NO SE ENCONTRO settings.gradle.kts"
            find proyecto -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado en: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Encontrar APK
        run: |
          set -e

          APK=$(find proyecto -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "NO SE ENCONTRO EL APK"
            find proyecto -type f -name "*.apk"
            exit 1
          fi

          echo "APK: $APK"

          mkdir -p resultado
          cp "$APK" resultado/CentroTouch.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CentroTouch-APK
          path: resultado/CentroTouch.apk
