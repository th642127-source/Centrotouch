name: Build CentroTouch APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extraer proyecto
        run: |
          mkdir -p proyecto
          unzip -o "CentroTouch-project.zip" -d proyecto

      - name: Buscar proyecto y compilar APK
        run: |
          PROJECT_DIR=$(find proyecto -name gradlew -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró gradlew dentro del proyecto."
            exit 1
          fi

          echo "Proyecto encontrado en: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CentroTouch-APK
          path: |
            proyecto/**/app/build/outputs/apk/debug/*.apk
